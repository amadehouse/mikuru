<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Cour d'Irina</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500;1,600;1,700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --velvet:#1b0f24; --velvet-2:#261533; --velvet-3:#321c44; --ivory:#f4e9da; --ivory-dim:#bfae9f;
  --gold:#e2b45a; --gold-deep:#b8862c; --gold-pale:#f4dca0; --fuchsia:#ff4f9a; --fuchsia-dim:#c23a78; --jade:#4fc3a1;
  --line:rgba(226,180,90,.22); --line-strong:rgba(226,180,90,.5);
  --nav-h:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--velvet)}
body{margin:0;color:var(--ivory);font:16px/1.5 Jost,system-ui,sans-serif;background:
  radial-gradient(120% 60% at 50% -10%,#4a2560 0%,transparent 60%),
  radial-gradient(80% 40% at 100% 100%,#3a1540 0%,transparent 60%),var(--velvet);min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--gold)}
h1,h2,h3{margin:0;font-family:Cormorant,Georgia,serif;font-weight:600}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--fuchsia);outline-offset:2px;border-radius:4px}

/* ---- crest / hero ---- */
.crest{padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;text-align:center;position:relative}
.crest .crown{width:54px;height:40px;display:block;margin:0 auto 2px;color:var(--gold)}
.crest h1{font-size:clamp(40px,11vw,76px);line-height:.95;font-style:italic;font-weight:700;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--gold-pale) 0%,var(--gold) 55%,var(--gold-deep) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.crest .motto{font-family:Cormorant,serif;font-style:italic;font-size:19px;color:var(--ivory-dim);margin-top:2px}
.crest .motto b{color:var(--ivory);font-weight:600}
.laurel{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin-top:8px;font-size:13px;letter-spacing:.06em}
.laurel::before,.laurel::after{content:"";height:1px;width:48px;background:linear-gradient(90deg,transparent,var(--gold));}
.laurel::after{background:linear-gradient(90deg,var(--gold),transparent)}

/* ---- toolbar ---- */
.tools{display:flex;gap:8px;padding:8px 14px 0;max-width:760px;margin:0 auto}
.search{flex:1;position:relative}
.search input{width:100%;height:44px;padding:0 14px 0 40px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ivory);outline:none}
.search input::placeholder{color:#8f8090}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:14px;top:13px;width:18px;height:18px;color:var(--gold)}

/* ---- layout ---- */
main{max-width:760px;margin:0 auto;padding:10px 14px 0}
@media(min-width:900px){main{max-width:1100px}}

/* page header (inner screens) */
.ph{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 0 6px;position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--velvet) 70%,rgba(27,15,36,0))}
.ph .back{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);flex:none}
.ph .back svg{width:20px;height:20px}
.ph .t{min-width:0}
.ph .crumb{font-size:12px;color:var(--ivory-dim);letter-spacing:.04em}
.ph h2{font-size:30px;font-style:italic;line-height:1.05;color:var(--ivory);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .cnt{margin-left:auto;font-family:Cormorant,serif;font-style:italic;font-size:17px;color:var(--gold);flex:none}

/* home: two halls */
.halls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 18px}
.hall{position:relative;border:1px solid var(--line-strong);border-radius:20px;padding:18px 16px 16px;text-align:left;background:linear-gradient(180deg,var(--velvet-3),var(--velvet-2));min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;overflow:hidden}
.hall::before{content:"";position:absolute;inset:6px;border:1px solid rgba(226,180,90,.14);border-radius:15px;pointer-events:none}
.hall .ic{position:absolute;top:14px;right:14px;width:30px;height:30px;color:var(--gold);opacity:.9}
.hall h3{font-size:30px;font-style:italic;color:var(--gold);line-height:1}
.hall .d{font-size:13px;color:var(--ivory-dim)}
.hall.f h3{color:var(--jade)}
.hall.f .ic{color:var(--jade)}

/* vertical list of categories */
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.02)}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:0 14px 0 12px;text-align:left;border-bottom:1px solid var(--line);color:var(--ivory)}
.row:last-child{border-bottom:0}
.row:active{background:rgba(226,180,90,.08)}
.row .ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--gold);flex:none}
.row .ic svg{width:20px;height:20px}
.row .ic.f{color:var(--jade);border-color:rgba(79,195,161,.5);font-family:Cormorant,serif;font-style:italic;font-size:18px}
.row .nm{font-family:Cormorant,serif;font-size:23px;font-weight:600;flex:1;line-height:1}
.row .n{font-family:Cormorant,serif;font-style:italic;font-size:17px;color:var(--ivory-dim)}
.row .chev{width:18px;height:18px;color:var(--ivory-dim);flex:none}
.row.dim{opacity:.55}

.kinds{display:flex;gap:6px;margin:8px 0 14px}
.kinds button{flex:1;height:38px;border-radius:999px;border:1px solid var(--line);color:var(--ivory-dim);font-size:14px}
.kinds button.on{background:var(--gold);border-color:var(--gold);color:var(--velvet);font-weight:600}
.ornament{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:4px 0 10px;font-family:Cormorant,serif;font-style:italic;font-size:18px}
.ornament::before,.ornament::after{content:"";height:1px;flex:1;max-width:80px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament::after{background:linear-gradient(90deg,var(--gold),transparent)}
.results h3{font-family:Cormorant,serif;font-style:italic;font-size:22px;color:var(--gold);margin:14px 0 8px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}}
/* tiles */
.tile{position:relative;aspect-ratio:9/14;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(160deg,var(--velvet-3),#1f1128);text-align:left;display:block;width:100%}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .ph2{position:absolute;inset:0;display:grid;place-items:center;font-family:Cormorant,serif;font-style:italic;font-weight:700;font-size:64px;color:rgba(226,180,90,.25)}
.tile .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,15,36,.1) 40%,rgba(27,15,36,.92))}
.tile .pfm{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:9px;font-size:13px}
.tile .kd{position:absolute;top:12px;left:44px;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--gold);color:var(--velvet);font-weight:600}
.tile .who{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:Cormorant,serif;font-style:italic;font-weight:700;font-size:18px;line-height:1;background:rgba(27,15,36,.75);border:1px solid var(--line-strong);color:var(--ivory)}
.tile .who.irina{background:linear-gradient(180deg,var(--gold-pale),var(--gold) 55%,var(--gold-deep));border-color:var(--gold-pale);color:var(--velvet);box-shadow:0 0 10px rgba(226,180,90,.6)}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:10px 10px 10px}
.tile .cap .t{font-family:Cormorant,serif;font-size:19px;line-height:1.05;font-weight:600;color:var(--ivory);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .cap .m{display:flex;align-items:center;gap:6px;white-space:nowrap;margin-top:5px;font-size:12px;color:var(--ivory-dim)}
.tile .cap .m b{color:var(--gold);font-family:Cormorant,serif;font-size:15px}
.tile .cap .m .dot{width:3px;height:3px;border-radius:50%;background:var(--ivory-dim)}
.tile:active{transform:scale(.98)}
/* detail */
.detail .cover{position:relative;margin:-12px -18px 14px;background:#120a18}
.detail .cover img{display:block;width:100%;max-height:52vh;object-fit:contain}
.detail .cover .close{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;background:rgba(27,15,36,.7);border:1px solid var(--line-strong);color:var(--ivory);display:grid;place-items:center}
.detail .cover .close svg{width:18px;height:18px}
.detail .card{border:0;background:none;padding:0}
.detail .card::before{display:none}
.detail .nocover{display:flex;justify-content:flex-end;margin-bottom:6px}
/* cover picker */
.cov{display:flex;gap:12px;align-items:center}
.cov .prev{width:72px;height:112px;border-radius:12px;border:1px dashed var(--line-strong);background:rgba(0,0,0,.25);display:grid;place-items:center;color:var(--gold);overflow:hidden;flex:none}
.cov .prev img{width:100%;height:100%;object-fit:cover}
.cov .prev svg{width:26px;height:26px}
.cov .btns{display:flex;flex-direction:column;gap:8px}
.cov .btns label,.cov .btns button{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);color:var(--gold);display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;font-family:Jost;font-style:normal;margin:0}
.cov .btns .rm{color:#ff8fb6;border-color:rgba(255,79,154,.35)}
.cov input[type=file]{display:none}
.cov .st{font-size:12px;color:var(--ivory-dim)}
.card{position:relative;background:linear-gradient(180deg,var(--velvet-3),var(--velvet-2));border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card::before{content:"";position:absolute;inset:6px;border:1px solid rgba(226,180,90,.12);border-radius:13px;pointer-events:none}
.card .top{display:flex;gap:12px;align-items:flex-start}
.pf{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:Cormorant,serif;font-weight:700;font-size:17px;flex:none;color:var(--velvet);background:var(--gold)}
.pf.tiktok{background:#f4e9da}.pf.instagram{background:linear-gradient(135deg,#ff8a5b,#ff4f9a,#9b4fff);color:#fff}.pf.x{background:#f4e9da}.pf.youtube{background:#ff5d5d;color:#fff}
.card .ttl{font-family:Cormorant,serif;font-size:22px;line-height:1.15;font-weight:600;word-break:break-word}
.card .hdl{color:var(--ivory-dim);font-size:13px;word-break:break-all;margin-top:2px}
.open{margin-left:auto;flex:none;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);color:var(--gold);font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ivory-dim)}
.chip.c{border-color:rgba(255,79,154,.5);color:#ffb3d1}.chip.f{border-color:rgba(79,195,161,.5);color:#9fe3cd}
.chip.k{background:var(--gold);border-color:var(--gold);color:var(--velvet);font-weight:600}
.chip.clickable{cursor:pointer}
.ratings{display:flex;flex-direction:column;gap:2px}
.ratings .rh{font-family:Cormorant,serif;font-style:italic;font-size:17px;color:var(--ivory-dim);margin-bottom:2px}
.rating{display:flex;align-items:center;gap:4px 10px;flex-wrap:wrap;padding:6px 10px;margin:0 -10px;border-radius:12px}
.rating.ctx{background:rgba(255,79,154,.1);border:1px solid rgba(255,79,154,.3)}
.rating .lbl{font-family:Cormorant,serif;font-weight:600;font-size:18px;color:var(--ivory);min-width:96px}
.sorts{display:flex;align-items:center;gap:6px;margin:-6px 0 14px;font-size:13px;color:var(--ivory-dim)}
.sorts span{margin-right:2px}
.sorts button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--ivory-dim);font-size:13px}
.sorts button.on{border-color:var(--fuchsia);color:var(--ivory);background:rgba(255,79,154,.18)}
.gems{display:flex;gap:3px}
.gems button{width:26px;height:30px;display:grid;place-items:center}
.gems svg{width:16px;height:16px;fill:rgba(226,180,90,.18);stroke:var(--gold-deep);stroke-width:1;transition:transform .15s}
.gems button.lit svg{fill:var(--gold);stroke:var(--gold-pale);filter:drop-shadow(0 0 4px rgba(226,180,90,.8))}
.gems button:active svg{transform:scale(1.25)}
.gems button:disabled{cursor:default;opacity:.6}
.avg{font-size:13px;color:var(--ivory-dim);margin-left:auto}
.avg b{color:var(--gold);font-family:Cormorant,serif;font-size:17px}
.notes label{font-family:Cormorant,serif;font-style:italic;font-size:17px;color:var(--ivory-dim);display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.notes textarea{width:100%;min-height:58px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.25);color:var(--ivory);outline:none;line-height:1.45}
.notes textarea::placeholder{color:#7d6e80}
.notes textarea:focus{border-color:var(--gold)}
.notes .other{background:rgba(0,0,0,.2);border-left:2px solid var(--fuchsia);padding:8px 12px;border-radius:0 10px 10px 0;white-space:pre-wrap;color:#e8d9cc;font-size:15px}
.saved{font-size:12px;color:var(--jade);font-family:Jost;font-style:normal}
.foot{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.foot button{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--ivory-dim);font-size:14px}
.foot button.danger{color:#ff8fb6;border-color:rgba(255,79,154,.3)}
.foot .by{margin-left:auto;font-size:12px;color:#8f8090}

.empty{padding:44px 20px;text-align:center;border:1px dashed var(--line-strong);border-radius:18px;color:var(--ivory-dim)}
.empty b{display:block;font-family:Cormorant,serif;font-style:italic;font-size:28px;color:var(--gold);margin-bottom:6px;font-weight:600}
.notice{border:1px solid var(--line);background:rgba(226,180,90,.08);color:var(--gold-pale);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}
.notice.err{border-color:rgba(255,79,154,.4);background:rgba(255,79,154,.1);color:#ffc2d9}
.how{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px;color:var(--ivory-dim);font-size:14px;line-height:1.55}
.how b{color:var(--ivory)}
.how .t{font-family:Cormorant,serif;font-style:italic;font-size:22px;color:var(--gold);display:block;margin-bottom:4px}

/* ---- bottom nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 10px env(safe-area-inset-bottom);background:linear-gradient(180deg,rgba(27,15,36,0),rgba(27,15,36,.96) 30%)}
.nav .in{max-width:480px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:end;padding-bottom:8px}
.nav button{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8f8090;font-size:12px;font-weight:500;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--gold)}
.nav .add{height:62px}
.nav .add span{width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,var(--gold-pale),var(--gold) 50%,var(--gold-deep));display:grid;place-items:center;color:var(--velvet);box-shadow:0 8px 24px -6px rgba(226,180,90,.6),inset 0 1px 0 #fff6;transform:translateY(-10px)}
.nav .add svg{width:26px;height:26px}
.nav .pip{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:999px;background:var(--fuchsia);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 5px}

/* ---- sheet ---- */
.overlay{position:fixed;inset:0;background:rgba(10,4,14,.7);backdrop-filter:blur(4px);z-index:50;display:grid;align-items:end}
@media(min-width:700px){.overlay{align-items:center;justify-items:center;padding:20px}}
.sheet{background:linear-gradient(180deg,#34204a,var(--velvet-2));border:1px solid var(--line-strong);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow:auto;padding:12px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{max-width:620px;border-radius:24px;border-bottom:1px solid var(--line-strong)}}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 12px}
.sheet h2{font-size:30px;font-style:italic;margin-bottom:14px}
.field{margin-bottom:16px}
.field label{display:block;font-family:Cormorant,serif;font-style:italic;font-size:19px;color:var(--gold);margin-bottom:6px}
.field input{width:100%;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25);color:var(--ivory);outline:none}
.field input:focus{border-color:var(--gold)}
.hint{font-size:13px;color:var(--ivory-dim);margin-top:6px}
.preview{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--ivory-dim)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--ivory-dim);display:inline-flex;align-items:center;gap:7px;font-size:14px}
.pick button .ic{width:16px;height:16px}
.pick button.on{color:var(--ivory)}
.pick button.on.c{border-color:var(--fuchsia);background:rgba(255,79,154,.2)}
.pick button.on.f{border-color:var(--jade);background:rgba(79,195,161,.18)}
.pick button.on.k{border-color:var(--gold);background:var(--gold);color:var(--velvet);font-weight:600}
.actions{display:flex;gap:10px;margin-top:8px}
.actions button{flex:1;height:50px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ivory);font-weight:500;font-size:16px}
.actions .go{background:linear-gradient(180deg,var(--gold-pale),var(--gold) 50%,var(--gold-deep));color:var(--velvet);border:0;font-weight:600}

.login{position:fixed;inset:0;z-index:60;background:var(--velvet);display:grid;place-items:center;padding:20px}
.login .box{width:100%;max-width:360px;text-align:center}
.login .who{display:flex;gap:10px;justify-content:center;margin:18px 0 14px}
.login .who button{height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ivory-dim);font-family:Cormorant,serif;font-style:italic;font-size:22px}
.login .who button.on{background:var(--gold);border-color:var(--gold);color:var(--velvet);font-weight:600}
.login input{width:100%;height:52px;text-align:center;letter-spacing:.4em;font-size:22px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.25);color:var(--ivory);outline:none}
.login input:focus{border-color:var(--gold)}
.login .go{margin-top:12px;width:100%;height:50px;border-radius:999px;background:linear-gradient(180deg,var(--gold-pale),var(--gold) 50%,var(--gold-deep));color:var(--velvet);font-weight:600;font-size:16px}
.login .bad{color:#ff8fb6;font-size:14px;min-height:20px;margin-top:8px}
.covst{font-size:12px;color:var(--ivory-dim);display:flex;gap:8px;align-items:center;margin:-4px 0 4px}
.covst button{color:var(--gold);text-decoration:underline;font-size:12px}
.logout{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;font-size:12px;color:var(--ivory-dim)}
/* ---- cosplan ---- */
.hall.cp{width:100%;margin-top:12px;min-height:0;padding:16px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.hall.cp .ic{position:static;width:34px;height:34px;color:var(--fuchsia)}
.hall.cp h3{color:var(--fuchsia);font-size:28px}
.hall.cp .d{display:block;margin-top:3px}
.cfilters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:6px 0 14px;padding-bottom:2px}
.cfilters::-webkit-scrollbar{display:none}
.cfilters button{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);color:var(--ivory-dim);font-size:14px}

<script>
/* ---------- taxonomie ---------- */
const COSPLAY=[["perruque","Perruque"],["lentilles","Lentilles"],["makeup","Makeup"],["costume","Costume"],["chaussures","Chaussures"],["collants","Collants"],["accessoires","Accessoires"],["armes","Armes"]];

  collants:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h10l1 9-3 9h-3v-8v8H9L6 12z"/><path d="M7 7h10"/></svg>',

/* ---------- état ---------- */
let chars=[],convs=[],contents=[],charForm=null,convForm=null,contentForm=null,uid=null,users=[],assets=true,canWrite=null,reels=[],names={},modal=null,detail=null,pollTimer=null;
let state={screen:"home",tab:"cosplay",cat:null,kind:"tous",sort:"recent",q:""};
const dirtyNotes=new Map();

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseUrl(u){let platform="autre",handle="",id="";try{const url=new URL(u.trim());const h=url.hostname.replace(/^www\.|^vm\.|^m\./,"");const p=url.pathname.split("/").filter(Boolean);
  if(/tiktok\.com$/.test(h)){platform="tiktok";handle=p.find(x=>x.startsWith("@"))||"";id=p[p.indexOf("video")+1]||"";}
  else if(/instagram\.com$/.test(h)){platform="instagram";const i=p.findIndex(x=>["reel","reels","p"].includes(x));id=i>=0?p[i+1]||"":"";if(i>0)handle="@"+p[0];}
  else if(/(twitter|x)\.com$/.test(h)){platform="x";if(p[0])handle="@"+p[0];id=p[p.indexOf("status")+1]||"";}
  else if(/(youtube\.com|youtu\.be)$/.test(h)){platform="youtube";handle=p.find(x=>x.startsWith("@"))||"";id=url.searchParams.get("v")||p[p.length-1]||"";}
  else handle=h;}catch(e){}return{platform,handle,id};}
const PF={tiktok:"Tk",instagram:"Ig",x:"X",youtube:"Yt",autre:"↗"};
const PFNAME={tiktok:"TikTok",instagram:"Instagram",x:"X",youtube:"YouTube",autre:"Lien"};
function nameOf(id){if(!id)return"la cour";if(id===uid)return"toi";return id;}
const mean=v=>v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null;
// Note d'une catégorie (moyenne de vous deux) ; sans catégorie : moyenne des catégories notées.
function avgRating(r,cat){
  const cr=r.catRatings||{};
  if(cat)return mean(Object.values(cr[cat]||{}).filter(n=>typeof n==="number"));
  return mean(Object.keys(cr).map(c=>avgRating(r,c)).filter(x=>x!=null));
}
const myRating=(r,cat)=>r.catRatings?.[cat]?.[uid];
const ctxCat=()=>state.screen==="reels"?state.cat:null;
const isClassified=r=>((r.cosplay?.length||0)+(r.format?.length||0))>0&&r.status!=="a_classer";

/* ---------- rendu ---------- */
function render(){
  const inbox=reels.filter(r=>!isClassified(r));
  $("#inboxCount").textContent=inbox.length; $("#inboxCount").style.display=inbox.length?"grid":"none";
  const n=reels.length-inbox.length; $("#tally").textContent=n?`${n} reel${n>1?"s":""} à sa gloire`:"les archives s'ouvrent";
  const home=state.screen==="home";
  $(".crest").classList.toggle("hidden",!home); $("#homeTools").classList.toggle("hidden",!home);
  const navOn={cosplay:"cosplay",char:"cosplay",convs:"convs",conv:"convs",contents:"contents"}[state.screen]||"home";
  document.querySelectorAll(".nav [data-tab]").forEach(t=>t.classList.toggle("on",t.dataset.tab===navOn));
  let html;
  if(state.screen==="inbox") html=pageHead("Offrandes","Accueil",inbox.length)+renderInbox(inbox);
  else if(home) html=state.q.trim()?renderSearch():renderHome();
  else if(state.screen==="list") html=renderList();
  else if(state.screen==="cosplay") html=renderCosplay();
  else if(state.screen==="convs") html=renderConvs();
  else if(state.screen==="conv") html=renderConv();
  else if(state.screen==="contents") html=renderContents();
  else if(state.screen==="char") html=renderChar();
  else html=renderReels();
  $("#view").innerHTML=html; wireView($("#view")); if(detail)renderDetail();
}
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg>';
function pageHead(title,crumb,count){
  return `<div class="ph"><button class="back" data-back aria-label="Retour"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
    <div class="t"><div class="crumb">${esc(crumb)}</div><h2>${esc(title)}</h2></div>${count!=null?`<span class="cnt">${count} reel${count>1?"s":""}</span>`:""}</div>`;
}
function renderHome(){
  const nC=reels.filter(r=>isClassified(r)&&r.cosplay?.length).length, nF=reels.filter(r=>isClassified(r)&&r.format?.length).length;
  const inboxN=reels.filter(r=>!isClassified(r)).length;
  return `${hypeBlock()}
  ${inboxN?`<button class="offr" data-tabgo="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 13l2-8h14l2 8v6H3z"/><path d="M3 13h5l2 3h4l2-3h5"/></svg><span><b>${inboxN} offrande${inboxN>1?"s":""}</b> à ranger</span>${CHEV}</button>`:""}
  <div class="halls">
    <button class="hall" data-open="cosplay"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 3h8l1 3 4 2-2 4-2-1v10H7V11l-2 1-2-4 4-2z"/></svg><h3>Cosplay</h3><span class="d">${COSPLAY.length} parties · ${nC} reels</span></button>
    <button class="hall f" data-open="format"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg><h3>Format</h3><span class="d">${FORMAT.length} chapitres · ${nF} reels</span></button>
  </div>
  ${cosplanHall()}
  <div class="ornament">derniers ajouts</div>
  ${recent()}`;
}
function recent(){
  const items=reels.filter(isClassified).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,3);
  return items.length?`<div class="grid">${items.map(tile).join("")}</div>`:`<div class="empty"><b>Les archives sont vierges</b>Appuie sur + pour déposer le premier reel.</div>`;
}
function renderList(){
  const isC=state.tab==="cosplay", cats=isC?COSPLAY:FORMAT, field=isC?"cosplay":"format";
  const rows=cats.map(([k,l],i)=>{const n=countFor(k,field);return `<button class="row ${n?"":"dim"}" data-cat="${k}"><span class="ic ${isC?"":"f"}">${isC?ICONS[k]:(i+1)}</span><span class="nm">${l}</span><span class="n">${n||"—"}</span>${CHEV}</button>`;}).join("");
  return pageHead(isC?"Cosplay":"Format","Accueil")+`<div class="list">${rows}</div>`;
}
function filtered(){const q=state.q.trim().toLowerCase();return reels.filter(r=>{if(!isClassified(r))return false;
  const list=state.tab==="cosplay"?(r.cosplay||[]):(r.format||[]);if(!list.includes(state.cat))return false;
  if(state.kind!=="tous"&&!(r.kind||[]).includes(state.kind))return false;return true;}).sort(sorter());}
function sorter(){
  const recent=(a,b)=>(b.createdAt||0)-(a.createdAt||0);
  if(state.sort==="recent")return recent;
  const val=state.sort==="mine"?r=>myRating(r,state.cat):r=>avgRating(r,state.cat);
  return (a,b)=>{const x=val(a),y=val(b);if(x==null&&y==null)return recent(a,b);if(x==null)return 1;if(y==null)return -1;return y-x||recent(a,b);};
}
const countFor=(k,f)=>reels.filter(r=>isClassified(r)&&(r[f]||[]).includes(k)).length;
function renderReels(){
  const items=filtered();
  return pageHead(LABEL[state.cat],state.tab==="cosplay"?"Cosplay":"Format",items.length)+
  `<div class="kinds"><button data-kind="tous" class="${state.kind==="tous"?"on":""}">Tous</button><button data-kind="inspi" class="${state.kind==="inspi"?"on":""}">Inspi</button><button data-kind="tuto" class="${state.kind==="tuto"?"on":""}">Tutorial</button></div>
  <div class="sorts"><span>Trier</span><button data-sort="recent" class="${state.sort==="recent"?"on":""}">Récents</button><button data-sort="top" class="${state.sort==="top"?"on":""}">Mieux notés</button><button data-sort="mine" class="${state.sort==="mine"?"on":""}">Ma note</button></div>
  ${items.length?`<div class="grid">${items.map(tile).join("")}</div>`:`<div class="empty"><b>Le trône attend</b>Aucun reel en « ${LABEL[state.cat]} »${state.kind!=="tous"?" / "+LABEL[state.kind]:""}.</div>`}`;
}
function renderSearch(){
  const q=state.q.trim().toLowerCase();
  const items=reels.filter(r=>[r.title,r.url,r.handle,...(r.cosplay||[]).map(k=>LABEL[k]),...(r.format||[]).map(k=>LABEL[k]),...(r.kind||[]).map(k=>LABEL[k]),...Object.values(r.notes||{})].join(" ").toLowerCase().includes(q));
  return `<div class="results"><h3>${items.length} résultat${items.length>1?"s":""} pour « ${esc(state.q.trim())} »</h3>${items.length?`<div class="grid">${items.map(tile).join("")}</div>`:`<div class="empty"><b>Rien dans les archives</b>Essaie un tag, un titre ou un mot de tes notes.</div>`}</div>`;
}
function renderInbox(inbox){
  return `<div class="how"><span class="t">La salle des offrandes</span>Depuis TikTok, Insta ou X : <b>Partager → Copier le lien</b>, puis le bouton <b>+</b> ici et colle. Un reel sans tag attend dans cette salle jusqu'à ce que la cour le range.</div>
  ${inbox.length?`<div class="grid">${inbox.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(tile).join("")}</div>`:`<div class="empty"><b>La salle est vide</b>Tout a été rangé dans les archives.</div>`}`;
}
function tile(r){
  const cu=coverUrl(r),avg=avgRating(r,ctxCat()),kind=(r.kind||[])[0];
  return `<button class="tile" data-tile="${r.id}">
    ${cu?`<img src="${cu}" alt="" loading="lazy" onerror="this.remove()">`:`<div class="ph2">${PF[r.platform]||"↗"}</div>`}
    <div class="shade"></div>
    <span class="pf pfm ${r.platform||"autre"}">${PF[r.platform]||"↗"}</span>
    ${kind?`<span class="kd">${LABEL[kind]}</span>`:""}
    ${r.addedBy?`<span class="who ${/^irina$/i.test(r.addedBy)?"irina":""}" title="Ajouté par ${esc(r.addedBy)}">${esc(r.addedBy.trim()[0].toUpperCase())}</span>`:""}
    <div class="cap"><div class="t">${esc(r.title||r.handle||PFNAME[r.platform]||"Reel")}</div>
      <div class="m">${avg!=null?`<b>${avg}</b><span>/10</span>`:`<span>non noté</span>`}${!isClassified(r)?`<span class="dot"></span><span>à ranger</span>`:""}</div></div>
  </button>`;
}
function openDetail(id){detail=id;renderDetail();}
function closeDetail(){detail=null;$("#detailHost").innerHTML="";}
function renderDetail(){
  const r=reels.find(x=>x.id===detail); if(!r){closeDetail();return;}
  const host=$("#detailHost"); const cu=coverUrl(r);
  const a=document.activeElement, keep=a&&host.contains(a)&&a.matches("[data-notes]")?{v:a.value,p:a.selectionStart}:null;
  host.innerHTML=`<div class="overlay" id="dov"><div class="sheet detail">
    ${cu?`<div class="cover"><img src="${cu}" alt=""><button class="close" data-close aria-label="Fermer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`
        :`<div class="grab"></div><div class="nocover"><button class="open" data-close>Fermer</button></div>`}
    ${card(r,!isClassified(r))}
  </div></div>`;
  $("#dov").addEventListener("click",e=>{if(e.target.id==="dov")closeDetail();});
  host.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeDetail));
  wireView(host);
  if(keep){const ta=host.querySelector("[data-notes]");if(ta){ta.value=keep.v;ta.focus();try{ta.setSelectionRange(keep.p,keep.p);}catch(e){}}}
 
}

/* ---------- cosplan ---------- */
const CSTATUS=[["idee","Idée"],["prep","En préparation"],["pret","Prêt"],["porte","Porté"]];
const CSTATUS_PL={idee:"Idées",prep:"En préparation",pret:"Prêts",porte:"Portés"};
const CSTATUS_SHORT={idee:"Idée",prep:"En prépa",pret:"Prêt",porte:"Porté"};
const PSTATE=[["a_faire","À faire"],["a_acheter","À acheter"],["en_cours","En cours"],["fait","Fait"],["na","Pas besoin"]];
const refUrl=c=>c.ref?"/covers/"+c.ref:null;
const euro=n=>(Math.round((n||0)*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+" €";
function daysTo(date){if(!date)return null;const t=new Date(date+"T00:00:00"),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5);}
function jx(date){const d=daysTo(date);if(d==null)return "";if(d>0)return "J-"+d;if(d===0)return "Jour J";return "";}
function progress(c){const ps=Object.values(c.parts||{});const live=ps.filter(p=>p.state!=="na");const done=live.filter(p=>p.state==="fait").length;
  const total=ps.reduce((a,p)=>a+(p.state!=="na"?(p.cost||0):0),0);const toBuy=ps.reduce((a,p)=>a+(p.state==="a_acheter"?(p.cost||0):0),0);
  return {done,n:live.length,pct:live.length?Math.round(done/live.length*100):0,total,toBuy};}
const getC=id=>chars.find(c=>c.id===id);
const linkedReels=id=>reels.filter(r=>(r.chars||[]).includes(id)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
function nextChar(){return chars.filter(c=>c.status!=="porte"&&daysTo(effDate(c))!=null&&daysTo(effDate(c))>=0).sort((a,b)=>daysTo(effDate(a))-daysTo(effDate(b)))[0];}
function cosplanHall(){
  const nx=nextChar(),live=chars.filter(c=>c.status!=="porte").length;
  return `<button class="hall cp" data-tabgo="cosplay"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 19l2-10 5 4 5-4 2 10z"/><circle cx="12" cy="5" r="1.6"/><circle cx="5" cy="7" r="1.4"/><circle cx="19" cy="7" r="1.4"/></svg>
    <span><h3>Mes cosplays</h3><span class="d">${chars.length?`${live} en cours · ${chars.filter(isWardrobe).length} en garde-robe${nx?` · prochain : ${esc(nx.name)}${effEvent(nx)?" — "+esc(effEvent(nx)):""} (${jx(effDate(nx))||"aujourd'hui"})`:""}`:"Les personnages qu'elle prépare"}</span></span></button>`;
}
function charCard(c,garde=false){
  const p=progress(c),u=refUrl(c),j=c.status!=="porte"?jx(effDate(c)):"";
  const worn=garde?wornList(c.id):[];
  return `<button class="chcard" data-char="${c.id}">
    ${u?`<img src="${u}" alt="" loading="lazy" onerror="this.remove()">`:`<div class="mono">${esc((c.name||"?").trim()[0]||"?")}</div>`}
    <div class="shade"></div><span class="st-pill st-${c.status}">${CSTATUS_SHORT[c.status]||""}</span>${j?`<span class="jx">${j}</span>`:""}
    <div class="cap"><div class="nm">${esc(c.name)}</div>${c.series?`<div class="sr">${esc(c.series)}</div>`:""}
      ${garde?`<div class="mt" style="margin-top:8px"><span>${worn.length?`porté ${worn.length}× · ${esc(worn[0].conv.name)}`:"jamais porté en convention"}</span></div>`
      :`<div class="bar"><i style="width:${p.pct}%"></i></div><div class="mt"><span>${p.done}/${p.n} prêt${p.done>1?"s":""}</span>${p.total?`<b>${euro(p.total)}</b>`:""}</div>`}</div>
  </button>`;
}
const isWardrobe=c=>c.status==="pret"||c.status==="porte";
function wornList(id){const today=todayStr();const out=[];
  for(const v of convs)for(const [d,cid] of Object.entries(v.days||{}))if(cid===id&&d<today)out.push({conv:v,date:d});
  return out.sort((a,b)=>a.date<b.date?1:-1);}
function plannedList(id){const today=todayStr();const out=[];
  for(const v of convs)for(const [d,cid] of Object.entries(v.days||{}))if(cid===id&&d>=today)out.push({conv:v,date:d});
  return out.sort((a,b)=>a.date<b.date?-1:1);}
// La prochaine date d'un perso vient des conventions (repli : ancien champ manuel s'il n'est prévu nulle part)
const nextPlan=c=>plannedList(c.id)[0]||null;
const effDate=c=>nextPlan(c)?.date||c.date||"";
const effEvent=c=>nextPlan(c)?.conv.name||c.event||"";
// Jours de convention à venir, pour les menus « prévoir »
function upcomingDays(){const t=todayStr(),out=[];
  for(const v of convs.filter(v=>v.start&&(v.end||v.start)>=t).sort((a,b)=>a.start<b.start?-1:1))
    for(const [d,cid] of Object.entries(v.days||{}))if(d>=t)out.push({conv:v,date:d,cid});
  return out;}
function planOptions(charId,placeholder){const ud=upcomingDays();
  if(!ud.length)return `<option value="">Aucune convention à venir</option>`;
  let html=`<option value="">${placeholder}</option>`,cur=null;
  for(const x of ud){if(cur!==x.conv.id){if(cur)html+="</optgroup>";html+=`<optgroup label="${esc(x.conv.name)}">`;cur=x.conv.id;}
    const other=x.cid&&x.cid!==charId?getC(x.cid):null;
    const mine=!!charId&&x.cid===charId;
    html+=`<option value="${x.conv.id}|${x.date}" ${mine?"disabled":""}>${fdate(x.date,{weekday:"long",day:"numeric",month:"short"})}${mine?" ✓":other?` (remplace ${esc(other.name)})`:" · libre"}</option>`;}
  return html+"</optgroup>";}
async function planChar(charId,val){const [cid,day]=val.split("|");
  try{const d=await api("/convs/"+cid,{method:"PATCH",body:{days:{[day]:charId}}});applyConvLocal(d.conv);return true;}catch(e){showStatus("Impossible de prévoir ce jour.",true);return false;}}
async function unplanChar(val){const [cid,day]=val.split("|");
  try{const d=await api("/convs/"+cid,{method:"PATCH",body:{days:{[day]:null}}});applyConvLocal(d.conv);}catch(e){showStatus("Impossible de retirer ce jour.",true);}}
/* œuvres : liste exacte + regroupement par franchise (ex : « Persona » couvre Persona 3, Persona 5 Royal…) */
const normS=s=>(s||"").trim().toLowerCase();
const franchiseOf=s=>normS(s).split(/[\s:\-–]+/)[0]||"";
function oeuvreOptions(list){
  const series=[...new Map(list.filter(c=>c.series&&c.series.trim()).map(c=>[normS(c.series),c.series.trim()])).values()].sort((a,b)=>a.localeCompare(b,"fr"));
  const fr={};for(const s of series){const f=franchiseOf(s);(fr[f]??=[]).push(s);}
  const groups=Object.entries(fr).filter(([,v])=>v.length>1);
  const cnt=pred=>list.filter(pred).length, cur=state.oeuvre||"";
  let html=`<option value="">Toutes les œuvres (${list.length})</option>`;
  if(groups.length)html+=`<optgroup label="Franchises">${groups.map(([f,v])=>{const label=v[0].split(/[\s:\-–]+/)[0];
    return `<option value="f:${esc(f)}" ${cur==="f:"+f?"selected":""}>${esc(label)} — tout (${cnt(c=>franchiseOf(c.series)===f)})</option>`;}).join("")}</optgroup>`;
  html+=`<optgroup label="Œuvres">${series.map(s=>`<option value="s:${esc(normS(s))}" ${cur==="s:"+normS(s)?"selected":""}>${esc(s)} (${cnt(c=>normS(c.series)===normS(s))})</option>`).join("")}</optgroup>`;
  if(list.some(c=>!c.series||!c.series.trim()))html+=`<option value="none" ${cur==="none"?"selected":""}>Sans œuvre (${cnt(c=>!c.series||!c.series.trim())})</option>`;
  return html;
}
function matchOeuvre(c){const o=state.oeuvre||"";if(!o)return true;if(o==="none")return !c.series||!c.series.trim();
  if(o.startsWith("f:"))return franchiseOf(c.series)===o.slice(2);return normS(c.series)===o.slice(2);}
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"","fr",{sensitivity:"base"});
const bySeries=(a,b)=>{const x=normS(a.series),y=normS(b.series);if(!x&&y)return 1;if(x&&!y)return -1;return x.localeCompare(y,"fr")||byName(a,b);};
function cosplayTools(pool,sortKey,sorts){
  if(!pool.length)return "";
  const cur=state[sortKey]||sorts[0][0];
  return `<div class="ctools"><select class="sel osel" data-oeuvre aria-label="Filtrer par œuvre">${oeuvreOptions(pool)}</select>
    <div class="sorts"><span>Trier</span>${sorts.map(([k,l])=>`<button data-csort="${sortKey}:${k}" class="${cur===k?"on":""}">${l}</button>`).join("")}</div></div>`;
}
function renderCosplay(){
  const tab=state.ctab||"cosplan";

  if(tab==="garde"){
    const pool=chars.filter(isWardrobe), s=state.gsort||"nom";
    if(state.oeuvre&&!pool.some(matchOeuvre))state.oeuvre="";
    const items=pool.filter(matchOeuvre).sort(s==="oeuvre"?bySeries:byName);
    return pageHead("Cosplay","Accueil",null)+seg+cosplayTools(pool,"gsort",[["nom","Nom"],["oeuvre","Œuvre"]])+
    (items.length?`<div class="grid">${items.map(c=>charCard(c,true)).join("")}</div>`
      :pool.length?`<div class="empty"><b>Aucun costume</b>Rien dans la garde-robe pour cette œuvre.</div>`
      :`<div class="empty"><b>Garde-robe vide</b>Un costume arrive ici quand sa checklist est validée. Le + ajoute aussi un costume déjà fini.</div>`);
  }
  const f=state.cfilter||"tous", s=state.csort||"date";
  const pool=chars.filter(c=>!isWardrobe(c));
  if(state.oeuvre&&!pool.some(matchOeuvre))state.oeuvre="";
  const byDate=(a,b)=>{const da=daysTo(effDate(a)),db=daysTo(effDate(b));
    if(a.status!==b.status)return a.status==="prep"?-1:1;
    if(da!=null&&db!=null)return da-db; if(da!=null)return -1; if(db!=null)return 1; return (b.createdAt||0)-(a.createdAt||0);};
  const items=pool.filter(c=>f==="tous"||c.status===f).filter(matchOeuvre).sort(s==="nom"?byName:s==="oeuvre"?bySeries:byDate);
  return pageHead("Cosplay","Accueil",null)+seg+
  `<div class="cfilters"><button data-cfilter="tous" class="${f==="tous"?"on":""}">Tous</button><button data-cfilter="prep" class="${f==="prep"?"on":""}">En prépa</button><button data-cfilter="idee" class="${f==="idee"?"on":""}">Idées</button></div>`+
  cosplayTools(pool,"csort",[["date","Prochains"],["nom","Nom"],["oeuvre","Œuvre"]])+

    :pool.length?`<div class="empty"><b>Personne ici</b>Aucun perso pour ce filtre.</div>`
    :`<div class="empty"><b>Rien en préparation</b>Appuie sur + pour ajouter un personnage à cosplayer.</div>`);
}

function sumHtml(p){return `<div class="row1"><div><div class="big">${p.done} / ${p.n} parties prêtes</div></div>

function applyChar(c,full=true){const i=chars.findIndex(x=>x.id===c.id);if(i>=0)chars[i]=c;else chars.unshift(c);if(full)render();else{const s=$("#chSum");if(s)s.innerHTML=sumHtml(progress(c));}}
const charTimers=new Map();

}

/* ---------- conventions ---------- */
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};
const fdate=(d,o)=>new Date(d+"T12:00:00").toLocaleDateString("fr-FR",o);
const dayLabel=d=>fdate(d,{weekday:"short",day:"numeric"});
const nDays=v=>Object.keys(v.days||{}).length||1;
function convRange(v){if(!v.start)return "date à définir";const a=new Date(v.start+"T12:00:00"),b=new Date((v.end||v.start)+"T12:00:00");
  if(v.start===v.end||!v.end)return fdate(v.start,{weekday:"long",day:"numeric",month:"long"});
  return a.getMonth()===b.getMonth()?`${a.getDate()} – ${fdate(v.end,{day:"numeric",month:"long"})}`:`${fdate(v.start,{day:"numeric",month:"short"})} – ${fdate(v.end,{day:"numeric",month:"short"})}`;}
function nextConv(){const t=todayStr();return convs.filter(v=>v.start&&(v.end||v.start)>=t).sort((a,b)=>a.start<b.start?-1:1)[0];}
function hypeMsg(d,live){if(live)return "C'EST MAINTENANT. GLOIRE À LA REINE 👑";if(d===1)return "C'EST DEMAIN !!! 👑";if(d<=7)return "C'EST BIENTÔT !!!";if(d<=14)return "Dernière ligne droite, la cour retient son souffle.";
  if(d<=30)return "Ça devient sérieux. Les perruques tremblent.";if(d<=90)return "Les préparatifs commencent, la reine s'organise.";return "Le compte à rebours est lancé.";}
function hypeLevel(d,live){return live||d<=1?4:d<=7?3:d<=30?2:1;}
function hypeBlock(){
  const v=nextConv();
  if(!v)return `<button class="hype hype-0" data-tabgo="convs"><div class="hn">Aucune convention prévue</div><div class="hm">Ajoute la prochaine pour lancer le compte à rebours ✦</div></button>`;
  const t=todayStr(),live=v.start<=t, d=daysTo(v.start);
  const days=Object.entries(v.days||{});
  return `<button class="hype hype-${hypeLevel(d,live)}" data-conv="${v.id}">
    <div class="hn">${esc(v.name)}</div>
    <div class="hd">${convRange(v)}${v.city?" · "+esc(v.city):""} · ${nDays(v)} jour${nDays(v)>1?"s":""}</div>
    ${live?`<div class="hc"><span class="big">✦</span></div>`:`<div class="hc"><span class="big">${d}</span><span class="u">jour${d>1?"s":""}</span></div><div class="clock" id="hypeClock" data-start="${v.start}">${clockTxt(v.start)}</div>`}
    <div class="hm">${hypeMsg(d,live)}</div>
    <div class="hdays">${days.map(([dd,cid])=>{const c=getC(cid);return `<span class="hdp ${c?"":"empty"}"><i>${dayLabel(dd)}</i>${c?esc(c.name):"à choisir"}</span>`;}).join("")}</div>
  </button>`;
}
function clockTxt(start){const ms=new Date(start+"T00:00:00")-new Date();if(ms<=0)return "";const s=Math.floor(ms/1000)%86400;
  const H=Math.floor(s/3600),M=Math.floor(s%3600/60),S=s%60;return `${H} h ${String(M).padStart(2,"0")} min ${String(S).padStart(2,"0")} s`;}
function tickHype(){const el=document.getElementById("hypeClock");if(el)el.textContent=clockTxt(el.dataset.start);}
function convCard(v){const t=todayStr(),past=(v.end||v.start)<t,live=v.start<=t&&!past,d=daysTo(v.start);
  const days=Object.entries(v.days||{});
  return `<button class="cv ${past?"past":""}" data-conv="${v.id}">
    <div class="cvd">${v.start?`<b>${new Date(v.start+"T12:00:00").getDate()}</b><span>${fdate(v.start,{month:"short"})}</span>`:"<b>?</b>"}</div>
    <div class="cvm"><div class="cvn">${esc(v.name)}</div><div class="cvs">${v.city?esc(v.city)+" · ":""}${nDays(v)} jour${nDays(v)>1?"s":""}</div>
      <div class="cvc">${days.map(([dd,cid])=>{const c=getC(cid);return `<span class="${c?"":"empty"}">${dayLabel(dd)} · ${c?esc(c.name):"?"}</span>`;}).join("")}</div></div>
    ${past?"":`<div class="cvj">${live?"en cours":d!=null?"J-"+d:""}</div>`}
  </button>`;}
function renderConvs(){
  const t=todayStr(),up=convs.filter(v=>!v.start||(v.end||v.start)>=t).sort((a,b)=>(a.start||"9")<(b.start||"9")?-1:1),past=convs.filter(v=>v.start&&(v.end||v.start)<t).sort((a,b)=>a.start<b.start?1:-1);
  return pageHead("Conventions","Accueil",null)+
  (up.length?`<div class="cvlist">${up.map(convCard).join("")}</div>`:`<div class="empty"><b>Aucune convention à venir</b>Appuie sur + pour ajouter la prochaine.</div>`)+
  (past.length?`<div class="ornament">déjà vécues</div><div class="cvlist">${past.map(convCard).join("")}</div>`:"");
}
function charOptions(sel){const opt=c=>`<option value="${c.id}" ${sel===c.id?"selected":""}>${esc(c.name)}${c.status==="prep"?" (en prépa)":c.status==="idee"?" (idée)":""}</option>`;
  const w=chars.filter(isWardrobe).sort(byName),o=chars.filter(c=>!isWardrobe(c)).sort(byName);
  return `<option value="">— à choisir —</option>${w.length?`<optgroup label="Garde-robe">${w.map(opt).join("")}</optgroup>`:""}${o.length?`<optgroup label="Cosplan">${o.map(opt).join("")}</optgroup>`:""}`;}
function miniChar(c){const p=progress(c),u=refUrl(c);
  return `<button class="mini" data-char="${c.id}">${u?`<img src="${u}" alt="">`:`<span class="mm">${esc((c.name||"?")[0])}</span>`}
    <span class="mi"><b>${esc(c.name)}</b><span><span class="st-pill st-${c.status}">${CSTATUS_SHORT[c.status]}</span>${isWardrobe(c)?"":` ${p.pct} % prêt`}</span></span>${CHEV}</button>`;}
function renderConv(){
  const v=convs.find(x=>x.id===state.convId);if(!v){state.screen="convs";return renderConvs();}
  const t=todayStr(),d=daysTo(v.start),live=v.start&&v.start<=t&&(v.end||v.start)>=t,past=v.start&&(v.end||v.start)<t;
  const others=Object.entries(v.notes||{}).filter(([k,x])=>k!==uid&&x&&x.trim());
  return `<div class="cvp" data-cvp="${v.id}">`+pageHead(v.name,"Conventions",null)+`
    <div class="meta">${v.city?`<b>${esc(v.city)}</b>`:""}<span>${convRange(v)} · ${nDays(v)} jour${nDays(v)>1?"s":""}</span>${!past&&!live&&d!=null?`<span class="jx">J-${d}</span>`:live?`<span class="jx">en cours ✦</span>`:""}</div>
    <div class="sec">Un cosplay par jour</div>
    ${!chars.length?`<div class="tiny" style="margin-bottom:10px">Ajoute d'abord des personnages dans l'onglet Cosplay.</div>`:""}
    <div class="cdays">${Object.entries(v.days||{}).map(([dd,cid])=>{const c=getC(cid);return `<div class="cday" data-day="${dd}">
      <div class="dl"><b>${fdate(dd,{weekday:"long"})}</b> ${fdate(dd,{day:"numeric",month:"long"})}</div>
      <select class="sel" data-daychar aria-label="Cosplay du ${fdate(dd,{weekday:"long"})}">${charOptions(cid)}</select>
      ${c?miniChar(c):""}</div>`;}).join("")||`<div class="tiny">Ajoute les dates via Modifier.</div>`}</div>
    <div class="sec">Notes</div>
    <div class="notes"><label>Tes notes <span class="saved" data-vsaved></span></label><textarea data-vnotes placeholder="Billets, hôtel, trajet, planning des shootings…">${esc(v.notes?.[uid]||"")}</textarea>
      ${others.map(([k,x])=>`<label style="margin-top:10px">Notes de ${esc(nameOf(k))}</label><div class="other">${esc(x)}</div>`).join("")}</div>
    <div class="chfoot"><button data-vedit>Modifier</button><button class="danger" data-vdel style="margin-left:auto">Supprimer</button></div></div>`;
}
function applyConvLocal(v,full=true){const i=convs.findIndex(x=>x.id===v.id);if(i>=0)convs[i]=v;else convs.unshift(v);if(full)render();}
function wireConv(root){
  const el=root.querySelector("[data-cvp]");if(!el)return;const id=el.dataset.cvp;
  el.querySelectorAll("[data-day]").forEach(row=>row.querySelector("[data-daychar]").addEventListener("change",async e=>{
    try{const d=await api("/convs/"+id,{method:"PATCH",body:{days:{[row.dataset.day]:e.target.value||null}}});applyConvLocal(d.conv);}catch(err){showStatus("Enregistrement impossible.",true);}}));
  const ta=el.querySelector("[data-vnotes]");let tm;
  ta.addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(async()=>{try{const d=await api("/convs/"+id,{method:"PATCH",body:{notes:ta.value}});applyConvLocal(d.conv,false);
    const s=el.querySelector("[data-vsaved]");s.textContent="enregistré";setTimeout(()=>s.textContent="",1400);}catch(e){}},700);});
  el.querySelector("[data-vedit]").addEventListener("click",()=>openConvForm("edit",convs.find(x=>x.id===id)));
  const del=el.querySelector("[data-vdel]");
  del.addEventListener("click",async()=>{if(!del.dataset.arm){del.dataset.arm="1";del.textContent="Confirmer la suppression ?";setTimeout(()=>{delete del.dataset.arm;del.textContent="Supprimer";},3000);return;}
    try{await api("/convs/"+id,{method:"DELETE"});convs=convs.filter(x=>x.id!==id);go({screen:"convs"});}catch(e){showStatus("Suppression impossible.",true);}});
}
function openConvForm(mode,v){convForm={mode,d:{id:v?.id,name:v?.name||"",city:v?.city||"",start:v?.start||"",end:v?.end||""}};renderConvForm();setTimeout(()=>$("#v-name")?.focus(),80);}
function closeConvForm(){convForm=null;$("#modalHost").innerHTML="";}

  const n=d.start?Math.max(1,Math.round((new Date((d.end||d.start)+"T12:00:00")-new Date(d.start+"T12:00:00"))/864e5)+1):0;
  $("#modalHost").innerHTML=`<div class="overlay" id="vov"><form class="sheet" id="vf"><div class="grab"></div>
    <h2>${convForm.mode==="add"?"Nouvelle convention":"Modifier la convention"}</h2>
    <div class="field"><label for="v-name">Nom</label><input id="v-name" type="text" placeholder="ex : Japan Expo" value="${esc(d.name)}" required></div>
    <div class="field"><label for="v-city">Ville</label><input id="v-city" type="text" placeholder="ex : Paris" value="${esc(d.city)}"></div>
    <div class="two"><div class="field"><label for="v-start">Premier jour</label><input id="v-start" type="date" value="${esc(d.start)}" required></div>
      <div class="field"><label for="v-end">Dernier jour</label><input id="v-end" type="date" value="${esc(d.end)}" min="${esc(d.start)}"></div></div>
    <div class="hint" id="vHint" style="margin-bottom:12px">${n?`${n} jour${n>1?"s":""} de convention.`:"Choisis les dates."}</div>
    <div class="actions"><button type="button" id="v-cancel">Annuler</button><button type="submit" class="go">${convForm.mode==="add"?"Ajouter":"Enregistrer"}</button></div></form></div>`;
  $("#vov").addEventListener("click",e=>{if(e.target.id==="vov")closeConvForm();});$("#v-cancel").addEventListener("click",closeConvForm);
  ["name","city"].forEach(k=>$("#v-"+k).addEventListener("input",e=>d[k]=e.target.value));
  ["start","end"].forEach(k=>$("#v-"+k).addEventListener("change",e=>{d[k]=e.target.value;if(k==="start"&&(!d.end||d.end<d.start))d.end=d.start;renderConvForm();}));
  $("#vf").addEventListener("submit",async e=>{e.preventDefault();if(!d.name.trim()||!d.start)return;const b=$("#vf .go");b.disabled=true;
    try{const body={name:d.name,city:d.city,start:d.start,end:d.end||d.start};
      const v=(convForm.mode==="add"?await api("/convs",{method:"POST",body}):await api("/convs/"+d.id,{method:"PATCH",body})).conv;
      closeConvForm();applyConvLocal(v,false);go({screen:"conv",convId:v.id});}catch(err){b.disabled=false;showStatus("Enregistrement impossible.",true);}});
}

/* ---------- planificateur de contenu ---------- */
const TSTATUS=[["idee","Idée"],["a_tourner","À tourner"],["tourne","Tourné"],["poste","Posté"]];
const TSTATUS_PL={idee:"Idées",a_tourner:"À tourner",tourne:"Tournés",poste:"Postés"};
const PLAT=[["tiktok","TikTok"],["instagram","Insta"],["x","X"],["youtube","YouTube"]];
const reelName=r=>r?(r.title||r.handle||"reel"):"";
// Les « emprunts » d'un contenu : musique, danse, format + catégories ajoutées
const SLOTS=[["music","musique","♪","Musique"],["dance","danse","✦","Danse"],["format","format","▣","Format"]];
function borrowsOf(t){const out=[];
  for(const [k,cat,ic,lab] of SLOTS){const r=reels.find(x=>x.id===t[k+"Reel"]);if(r||t[k+"Text"])out.push({ic,lab,reel:r,text:t[k+"Text"]||""});}
  for(const x of t.extras||[]){const r=reels.find(y=>y.id===x.reel);const lab=x.cat?LABEL[x.cat]:x.label||"Autre";if(r||x.text)out.push({ic:"+",lab,reel:r,text:x.text||""});}
  return out;}
const contentAvg=t=>mean(Object.values(t.ratings||{}).filter(n=>typeof n==="number"));
function contentRow(t){const c=getC(t.char),u=c&&refUrl(c),dd=daysTo(t.date),bw=borrowsOf(t),avg=contentAvg(t);
  const withReel=bw.filter(b=>b.reel),textOnly=bw.filter(b=>!b.reel);
  return `<div class="ctr" data-ctn="${t.id}" role="button" tabindex="0">
    <span class="cth">${u?`<img src="${u}" alt="">`:`<span class="mm">${c?esc(c.name[0]):"✦"}</span>`}</span>
    <span class="ctm"><b>${esc(t.title)}</b>
      <span class="ctx">${c?`<i>♛ ${esc(c.name)}</i>`:""}${textOnly.map(b=>`<i>${b.ic==="+"?esc(b.lab)+" :":b.ic} ${esc(b.text)}</i>`).join("")}</span>
      <span class="ctd">${t.date?fdate(t.date,{weekday:"short",day:"numeric",month:"short"})+(dd!=null&&dd>=0&&t.status!=="poste"?(dd===0?" · aujourd'hui":dd===1?" · demain":""):""):"pas de date"}${(t.platforms||[]).length?" · "+t.platforms.map(p=>PLAT.find(x=>x[0]===p)?.[1]||p).join(", "):""}</span></span>
    <span class="ctr-r"><span class="tst ts-${t.status}">${TSTATUS.find(x=>x[0]===t.status)?.[1]}</span>${avg!=null?`<span class="cnote">${GEM}<b>${avg}</b></span>`:""}</span>
    ${withReel.length?`<span class="ctth">${withReel.map(b=>{const cu=coverUrl(b.reel);return `<button class="bt" data-tile="${b.reel.id}" title="${esc(b.lab)} : ${esc(reelName(b.reel))}">
      <span class="bi">${cu?`<img src="${cu}" alt="" loading="lazy">`:`<span class="mm">${PF[b.reel.platform]||"↗"}</span>`}<em>${b.ic==="+"?"+":b.ic}</em></span>
      <span class="bl">${esc(b.lab)}</span></button>`;}).join("")}</span>`:""}
  </div>`;}
function renderContents(){
  const f=state.tfilter||"tous",rank={a_tourner:0,idee:1,tourne:2,poste:3},ts=state.tsort||"date";
  const items=contents.filter(t=>f==="tous"||t.status===f).sort((a,b)=>{if(f==="tous"&&(a.status==="poste")!==(b.status==="poste"))return a.status==="poste"?1:-1;
    if(a.status==="poste"&&b.status==="poste")return (b.date||"")<(a.date||"")?-1:1;
    if(a.date&&b.date&&a.date!==b.date)return a.date<b.date?-1:1;if(a.date&&!b.date)return -1;if(b.date&&!a.date)return 1;return rank[a.status]-rank[b.status]||(b.createdAt||0)-(a.createdAt||0);});
  if(ts==="note")items.sort((a,b)=>{const x=contentAvg(a),y=contentAvg(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return y-x;});
  return pageHead("Contenu","Accueil",null)+
  `<div class="cfilters"><button data-tfilter="tous" class="${f==="tous"?"on":""}">Tout</button>${TSTATUS.map(([k])=>`<button data-tfilter="${k}" class="${f===k?"on":""}">${TSTATUS_PL[k]} <span class="n">${contents.filter(t=>t.status===k).length||""}</span></button>`).join("")}</div>
  ${contents.length>1?`<div class="sorts"><span>Trier</span><button data-tsort="date" class="${ts==="date"?"on":""}">Date</button><button data-tsort="note" class="${ts==="note"?"on":""}">Mieux notés</button></div>`:""}
  ${items.length?`<div class="ctlist">${items.map(contentRow).join("")}</div>`:`<div class="empty"><b>${contents.length?"Rien ici":"Aucun contenu prévu"}</b>${contents.length?"Aucun contenu avec ce statut.":"Appuie sur + pour planifier une vidéo : cosplay, son, danse."}</div>`}`;
}
function openContentForm(mode,t){contentForm={mode,d:{id:t?.id,title:t?.title||"",status:t?.status||"idee",date:t?.date||"",char:t?.char||"",
  musicReel:t?.musicReel||"",musicText:t?.musicText||"",danceReel:t?.danceReel||"",danceText:t?.danceText||"",formatReel:t?.formatReel||"",formatText:t?.formatText||"",
  extras:(t?.extras||[]).map(x=>({...x,reel:x.reel||""})),ratings:{...(t?.ratings||{})},myRating:t?.ratings?.[uid]??null,platforms:[...(t?.platforms||[])],notes:t?.notes||""}};renderContentForm();if(mode==="add")setTimeout(()=>$("#t-title")?.focus(),80);}
function closeContentForm(){contentForm=null;$("#modalHost").innerHTML="";}
// reels proposés : ceux de la catégorie d'abord ; « tous » pour une catégorie libre
function reelOptions(cat,sel){const pool=cat?reels.filter(r=>(r.format||[]).includes(cat)||(r.cosplay||[]).includes(cat)):reels.filter(isClassified);
  const list=pool.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return `<option value="">${list.length?"— choisir dans les archives —":cat?"— aucun reel « "+(LABEL[cat]||cat)+" » rangé —":"— aucun reel rangé —"}</option>${list.map(r=>`<option value="${r.id}" ${sel===r.id?"selected":""}>${esc(reelName(r))}</option>`).join("")}`;}
function pickedReel(r,verb){if(!r)return "";const cu=coverUrl(r);
  return `<a class="picked" href="${esc(r.url)}" target="_blank" rel="noopener">${cu?`<img src="${cu}" alt="">`:`<span class="mm">${PF[r.platform]||"↗"}</span>`}<span><b>${esc(reelName(r))}</b><i>${verb} ↗</i></span></a>`;}
function slotField(k,cat,label,ph,verb){const d=contentForm.d,r=reels.find(x=>x.id===d[k+"Reel"]);
  return `<div class="field"><label for="t-${k}r">${label}</label><select class="sel" id="t-${k}r" data-slot="${k}">${reelOptions(cat,d[k+"Reel"])}</select>
    ${r?pickedReel(r,verb):`<input id="t-${k}t" data-slott="${k}" type="text" placeholder="${ph}" value="${esc(d[k+"Text"])}" style="margin-top:8px">`}</div>`;}
function extraRow(x,i){const r=reels.find(y=>y.id===x.reel);
  return `<div class="xrow" data-x="${i}">
    <div class="xhead"><select class="sel" data-xcat aria-label="Catégorie">${FORMAT.filter(([k])=>!["musique","danse","format"].includes(k)).map(([k,l])=>`<option value="${k}" ${x.cat===k?"selected":""}>${l}</option>`).join("")}${COSPLAY.map(([k,l])=>`<option value="${k}" ${x.cat===k?"selected":""}>${l}</option>`).join("")}<option value="" ${!x.cat?"selected":""}>Autre…</option></select>
      <button type="button" class="xdel" data-xdel aria-label="Retirer cette catégorie">×</button></div>
    ${!x.cat?`<input type="text" data-xlabel placeholder="Nom de la catégorie (ex : transition)" value="${esc(x.label)}">`:""}
    <select class="sel" data-xreel aria-label="Reel repris">${reelOptions(x.cat,x.reel)}</select>
    ${r?pickedReel(r,"voir"):`<input type="text" data-xtext placeholder="ou ce qu'on reprend, en quelques mots…" value="${esc(x.text)}">`}
  </div>`;}
function renderContentForm(){const d=contentForm.d;
  const keep=$("#tf")?{top:$("#tov .sheet").scrollTop}:null;
  $("#modalHost").innerHTML=`<div class="overlay" id="tov"><form class="sheet" id="tf"><div class="grab"></div>
    <h2>${contentForm.mode==="add"?"Nouveau contenu":"Contenu"}</h2>
    <div class="field"><label for="t-title">Idée de vidéo</label><input id="t-title" type="text" placeholder="ex : transition Saber en armure" value="${esc(d.title)}" required></div>
    <div class="field"><label>Statut</label><div class="pick">${TSTATUS.map(([k,l])=>`<button type="button" data-tst="${k}" class="k ${d.status===k?"on":""}">${l}</button>`).join("")}</div></div>
    <div class="two"><div class="field"><label for="t-date">Date</label><input id="t-date" type="date" value="${esc(d.date)}"></div>
      <div class="field"><label>Où</label><div class="pick">${PLAT.map(([k,l])=>`<button type="button" data-tpl="${k}" class="f ${d.platforms.includes(k)?"on":""}">${l}</button>`).join("")}</div></div></div>
    <div class="field"><label for="t-char">Cosplay</label><select class="sel" id="t-char">${charOptions(d.char).replace("— à choisir —","— aucun —")}</select></div>
    ${slotField("music","musique","Musique","ou écris le son : titre, artiste…","écouter")}
    ${slotField("dance","danse","Danse","ou décris la danse / la trend…","voir la chorée")}
    ${slotField("format","format","Format repris","ou décris le format (ex : avant/après, POV…)","voir le format")}
    <div class="field"><label>Autres emprunts</label><div class="xrows">${d.extras.map(extraRow).join("")}</div>
      <button type="button" class="xadd" id="t-xadd">+ Ajouter une catégorie</button></div>
    <div class="field"><label>Ta note</label><div class="crate"><div class="gems">${Array.from({length:10},(_,i)=>`<button type="button" data-crate="${i+1}" class="${d.myRating>=i+1?"lit":""}" aria-label="${i+1} sur 10">${GEM}</button>`).join("")}</div>
      <span class="avg">${Object.entries(d.ratings).filter(([k])=>k!==uid).map(([k,v])=>`${esc(nameOf(k))} <b>${v}</b>`).join(" · ")}</span></div></div>
    <div class="field"><label for="t-notes">Script / notes</label><textarea id="t-notes" class="ta" placeholder="Plans, texte à l'écran, lieu de tournage…">${esc(d.notes)}</textarea></div>
    <div class="actions">${contentForm.mode==="edit"?`<button type="button" id="t-del" class="del">Supprimer</button>`:`<button type="button" id="t-cancel">Annuler</button>`}<button type="submit" class="go">${contentForm.mode==="add"?"Planifier":"Enregistrer"}</button></div></form></div>`;
  if(keep)$("#tov .sheet").scrollTop=keep.top;
  $("#tov").addEventListener("click",e=>{if(e.target.id==="tov")closeContentForm();});$("#t-cancel")?.addEventListener("click",closeContentForm);
  $("#t-title").addEventListener("input",e=>d.title=e.target.value);$("#t-date").addEventListener("change",e=>d.date=e.target.value);$("#t-notes").addEventListener("input",e=>d.notes=e.target.value);
  $("#t-char").addEventListener("change",e=>d.char=e.target.value);
  document.querySelectorAll("[data-slot]").forEach(s=>s.addEventListener("change",()=>{d[s.dataset.slot+"Reel"]=s.value;renderContentForm();}));
  document.querySelectorAll("[data-slott]").forEach(s=>s.addEventListener("input",()=>d[s.dataset.slott+"Text"]=s.value));
  document.querySelectorAll("[data-x]").forEach(row=>{const x=d.extras[+row.dataset.x];
    row.querySelector("[data-xcat]").addEventListener("change",e=>{x.cat=e.target.value;x.reel="";renderContentForm();});
    row.querySelector("[data-xreel]").addEventListener("change",e=>{x.reel=e.target.value;renderContentForm();});
    row.querySelector("[data-xlabel]")?.addEventListener("input",e=>x.label=e.target.value);
    row.querySelector("[data-xtext]")?.addEventListener("input",e=>x.text=e.target.value);
    row.querySelector("[data-xdel]").addEventListener("click",()=>{d.extras.splice(+row.dataset.x,1);renderContentForm();});});
  $("#t-xadd").addEventListener("click",()=>{d.extras.push({cat:"hook",label:"",reel:"",text:""});renderContentForm();});
  document.querySelectorAll("[data-crate]").forEach(b=>b.addEventListener("click",()=>{const n=+b.dataset.crate;d.myRating=d.myRating===n?null:n;
    document.querySelectorAll("[data-crate]").forEach(x=>x.classList.toggle("lit",d.myRating!=null&&+x.dataset.crate<=d.myRating));}));
  document.querySelectorAll("[data-tst]").forEach(b=>b.addEventListener("click",()=>{d.status=b.dataset.tst;document.querySelectorAll("[data-tst]").forEach(x=>x.classList.toggle("on",x===b));}));
  document.querySelectorAll("[data-tpl]").forEach(b=>b.addEventListener("click",()=>{const k=b.dataset.tpl,i=d.platforms.indexOf(k);i>=0?d.platforms.splice(i,1):d.platforms.push(k);b.classList.toggle("on");}));

    try{await api("/contents/"+d.id,{method:"DELETE"});contents=contents.filter(x=>x.id!==d.id);closeContentForm();render();}catch(e){showStatus("Suppression impossible.",true);}});
